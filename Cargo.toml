[package]
name = "fast-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Static-dispatch, composable I/O and formatting inspired by C++ fast_io"
repository = "https://github.com/EienMiku/fast_io_rs"
publish = false

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lib]
name = "fast_io"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
