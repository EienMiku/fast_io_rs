[package]
name = "fast-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Static-dispatch, composable I/O and formatting inspired by C++ fast_io"
repository = "https://github.com/EienMiku/fast_io_rs"
publish = false

[workspace]
members = ["derive"]
resolver = "3"

[features]
default = ["std", "float"]
alloc = []
std = ["alloc"]
float = ["dep:zmij"]
derive = ["dep:fast-io-derive"]

[lib]
name = "fast_io"

[[example]]
name = "hello"
required-features = ["std"]

[[example]]
name = "scan_sum"
required-features = ["std"]

[[example]]
name = "throughput"
required-features = ["std"]

[[example]]
name = "custom"
required-features = ["std", "derive"]

[[example]]
name = "scan_throughput"
required-features = ["std"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
fast-io-derive = { path = "derive", version = "0.1.0", optional = true }
zmij = { version = "1", default-features = false, optional = true }
